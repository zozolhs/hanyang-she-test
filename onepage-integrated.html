const V24={
  url:"https://ahmqthuympannqsrszvv.supabase.co/functions/v1/",token:null,account:null,version:null,
  initial:null,pending:null,timer:null,busy:false,conflict:false,dirty:false,
  async req(kind,action,info={}){
    const tok=this.token||sessionStorage.getItem("she_v24_opaque_session_test");
    if(!tok)throw Error("V24 계정 로그인이 필요합니다.");
    let res;
    try{res=await fetch(this.url+(kind==="auth"?"she-v24-auth":"she-v24-store"),{
      method:"POST",credentials:"omit",cache:"no-store",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},
      body:JSON.stringify({action,...info})})}
    catch{throw Error("ONE-PAGE 서버와 연결할 수 없습니다.");}
    let data;try{data=await res.json()}catch{throw Error("서버 응답을 확인할 수 없습니다.");}
    if(!res.ok)throw Error(data.error||("서버 오류 "+res.status));
    return data;
  },
  async init(){
    this.token=sessionStorage.getItem("she_v24_opaque_session_test");
    if(!this.token)throw Error("통합관리시스템에서 먼저 로그인하세요.");
    const [user,record]=await Promise.all([this.req("auth","me"),this.req("store","onepage_get")]);
    this.account=user.account;
    if(this.account?.status!=="approved")throw Error("승인되지 않은 계정입니다.");
    if(!Array.isArray(record.data?.rows))throw Error("ONE-PAGE 데이터 형식 오류");
    this.version=record.updated_at;this.initial=record.data;return record.data;
  },
  canWrite(){const a=this.account;return !!a&&a.status==="approved"&&(a.role==="super_admin"||(a.role==="admin"&&a.permissions?.safety===true))},
  schedule(data){
    if(!this.canWrite()||this.conflict)return;
    this.pending=JSON.stringify(data);this.dirty=true;
    const status=document.getElementById("onepageConnection");
    if(status){status.textContent="⏳ ONE-PAGE 변경사항 자동 저장 대기 중";status.style.color="#92400e";}
    clearTimeout(this.timer);this.timer=setTimeout(()=>{this.timer=null;void this.flush().catch(()=>{})},650);
  },
  async flush(){
    clearTimeout(this.timer);this.timer=null;
    if(this.conflict)throw Error("변경 충돌: 이 화면을 닫지 말고 관리자를 호출하세요.");
    if(this.busy){
      // A photo upload can request flush while an earlier save is in flight.
      // Wait for the prior request and then flush any subsequent edits.
      for(let i=0;i<150&&this.busy;i++)await new Promise(r=>setTimeout(r,100));
      if(this.busy)throw Error("자동 저장을 마칠 수 없습니다. 잠시 후 다시 시도하세요.");
    }
    if(!this.pending)return;
    this.busy=true;
    try{
      while(this.pending){
        const raw=this.pending;this.pending=null;
        const response=await this.req("store","onepage_put",{
          expected_updated_at:this.version,data:JSON.parse(raw)
        });
        this.version=response.updated_at;
      }
      this.dirty=false;
      const status=document.getElementById("onepageConnection");
      if(status){status.textContent="✅ ONE-PAGE 서버 자동 저장 완료";status.style.color="#15803d";}
    }catch(e){
      this.conflict=true;this.dirty=true;
      const status=document.getElementById("onepageConnection");
      if(status){status.textContent="⚠️ 저장 실패: "+e.message;status.style.color="#b91c1c"}
      const backup=document.getElementById("bUnsavedBackup");if(backup)backup.hidden=false;
      toast("저장 실패. 화면을 닫지 마세요: "+e.message,20000);
      throw e;
    }finally{this.busy=false;}
  },
  photo(action,info={}){return this.req("store","onepage_photo_"+action,info)}
};

 counts:{},

async function makeThumb(blob,max=240){ const bmp=await createImageBitmap(blob); const k=Math.min(1,max/Math.max(bmp.width,bmp.height)); const w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k)); const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(bmp,0,0,w,h); return c.toDataURL('image/jpeg',.72); }
async function compress(file,max=1600,q=.82){
  let bmp; try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){ bmp=await createImageBitmap(file); }
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height)); const w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(bmp,0,0,w,h);
  return new Promise(r=>c.toBlob(b=>r({blob:b,w,h}),'image/jpeg',q));
}

const TH=['번호','분류','실시일','공종','위험성평가 실시 내용','팀리더','기술인','공사관리자','물산공사','물산안전','추가 참여자','위험성평가 제안','원본 사무실 제출','작업 예정일','현장이행 사진공유','비고','메일송부','제출일','위험성평가 적용','사진'];

let pg=0, PSZ=8, openIds=new Set();
function calcPS(){
  // 모바일 자연 높이 레이아웃에서는 컨테이너 높이에 따라 페이지 수가 변하지 않게 2건 고정.
  if(window.innerWidth<=600) return 2;
  const w=$('wrap'),mob=window.innerWidth<=900,rowH=mob?308:106;
