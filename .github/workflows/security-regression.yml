name: SHE V24 Security Regression

on:
  push:
    branches: [main]
    paths:
      - 'tests/security-regression.mjs'
      - 'tests/performance-regression.mjs'
      - 'tests/mobile-spreadsheet-export.mjs'
      - 'tests/mobile-export-guard.mjs'
      - 'mobile-export-guard.js'
      - 'supabase/migrations/20261122_mobile_export_incident_guard.sql'
      - 'mobile-spreadsheet-export.css'
      - 'onepage-integrated.html'
      - 'tests/security-live-smoke.mjs'
      - '.github/workflows/security-regression.yml'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'she-v24-index.js'
      - 'index.html'
      - 'roster.html'
      - 'dashboard.html'
      - 'health_check.html'
  pull_request:
    paths:
      - 'tests/security-regression.mjs'
      - 'tests/performance-regression.mjs'
      - 'tests/mobile-spreadsheet-export.mjs'
      - 'tests/mobile-export-guard.mjs'
      - 'mobile-export-guard.js'
      - 'supabase/migrations/20261122_mobile_export_incident_guard.sql'
      - 'mobile-spreadsheet-export.css'
      - 'onepage-integrated.html'
      - 'tests/security-live-smoke.mjs'
      - '.github/workflows/security-regression.yml'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'she-v24-index.js'
      - 'index.html'
      - 'roster.html'
      - 'dashboard.html'
      - 'health_check.html'

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify permissions, business workflows and API security
        run: node tests/security-regression.mjs
      - name: Credential-free negative API security smoke checks
        run: node tests/security-live-smoke.mjs
      - name: Verify conditional reads, batched initial loads, and Excel save compatibility
        run: node tests/performance-regression.mjs
      - name: Verify mobile Excel and CSV download buttons are hidden, desktop unaffected
        run: node tests/mobile-spreadsheet-export.mjs
      - name: Verify authenticated mobile forced-export detection and account safeguards
        run: node tests/mobile-export-guard.mjs
